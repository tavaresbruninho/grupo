<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Grupo do WhatsApp</title>
<style>
  :root { --fundo: #ffffff; --texto: #1d2b24; --verde: #1f9d55; }
  @media (prefers-color-scheme: dark) { :root { --fundo: #111814; --texto: #e8f0eb; } }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: var(--fundo); color: var(--texto); font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
         text-align: center; padding: 24px; box-sizing: border-box; }
  p { font-size: 24px; line-height: 1.4; margin: 0 0 28px; }
  a { display: inline-block; background: var(--verde); color: #fff; text-decoration: none;
      font-size: 22px; font-weight: 600; padding: 18px 28px; border-radius: 14px; }
</style>
</head>
<body>
<main>
  <p>Abrindo o grupo do WhatsApp…</p>
  <a id="botao" href="https://i.sndflw.com/i/X0HWwkyoTxcKL2PYylib">Entrar no grupo</a>
</main>
<script>
  // Registra o clique na planilha (Apps Script) e leva a pessoa para o SendFlow
  var RASTREIO = 'https://script.google.com/macros/s/AKfycbwGUFJssdA4aCZArP8RotArVyQuhZEeqOSzZ37DdAxuPloHcrS9iUmkYn7vYBVIS20/exec';
  var SENDFLOW = 'https://i.sndflw.com/i/X0HWwkyoTxcKL2PYylib';

  var busca = location.search || '';
  var destino = SENDFLOW + busca;
  document.getElementById('botao').href = destino;

  var registro = RASTREIO + (busca ? busca + '&' : '?') + 'pixel=1&t=' + Date.now();
  try { fetch(registro, { mode: 'no-cors', keepalive: true }); } catch (e) { new Image().src = registro; }

  setTimeout(function () { location.replace(destino); }, 500);
</script>
</body>
</html>
